name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore and Storage emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:unit

      - name: Security Rules tests
        run: npm run test:rules

      - name: Production build
        run: npm run build
        env:
          # The build must succeed without Firebase credentials — public pages
          # fall back to empty states rather than failing.
          NEXT_PUBLIC_SITE_URL: https://example.com
